services:
  postgres:
    build:
      context: ./backend
      dockerfile: db/Dockerfile
    environment:
      # Bootstrap superuser -- used only during container init (to create
      # app_migrator/app_runtime and run migrations). The application
      # itself never connects as this user.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres_dev_pw}
      POSTGRES_DB: carrier_recs
      # Consumed by backend/db/roles.sql via bootstrap.sh.
      APP_MIGRATOR_PASSWORD: ${APP_MIGRATOR_PASSWORD:-migrator_dev_pw}
      APP_RUNTIME_PASSWORD: ${APP_RUNTIME_PASSWORD:-runtime_dev_pw}
    ports:
      - "5432:5432"
    volumes:
      # Data only -- init scripts are baked into the image (see
      # db/Dockerfile), not bind-mounted, so there's nothing else to
      # mount here. Named volume so data survives `docker-compose down`
      # (but not `down -v`) -- and so init scripts only run once, on
      # first boot of an empty volume.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carrier_recs"]
      interval: 5s
      timeout: 5s
      retries: 10
  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://api:8000
    depends_on:
      - api
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # postgres, not localhost -- containers reach each other by
      # service name over the compose network, not the host loopback
      # interface. api/config.py already reads PGHOST from the
      # environment (defaults to localhost for bare `uvicorn` runs
      # outside Docker), so this is the only change needed to point it
      # at the right host.
      PGHOST: postgres
      PGDATABASE: carrier_recs
      APP_RUNTIME_PASSWORD: ${APP_RUNTIME_PASSWORD:-runtime_dev_pw}
    depends_on:
      postgres:
        condition: service_healthy


volumes:
  pgdata:
